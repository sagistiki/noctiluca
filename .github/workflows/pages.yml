# Publishes the site in site/ to GitHub Pages whenever it changes on main.
name: Pages

on:
  push:
    branches: [main]
    # The site shows the library's size, read from the app's code.
    paths: ["site/**", "src/director.rs", ".github/workflows/pages.yml", ".github/scripts/library.py"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Count the look library from the code
        run: python3 .github/scripts/library.py src/director.rs > site/library.json
      # Each deploy's own CSS and scripts: a browser never mixes a new page
      # with the last deploy's files from its cache.
      - name: Stamp the build on the page's files
        run: sed -i "s/?v=BUILD/?v=${GITHUB_SHA::8}/g" site/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
