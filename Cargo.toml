[package]
name = "noctiluca"
version = "0.2.0"
edition = "2024"
description = "A live club visualizer for macOS: screens, projectors, TV boxes and DMX lights, in sync with the music"
license = "MIT"
repository = "https://github.com/sagistiki/noctiluca"
readme = "README.md"

[dependencies]
anyhow = "1.0.104"
bytemuck = { version = "1.25.2", features = ["derive", "min_const_generics"] }
clap = { version = "4.6.9", features = ["derive"] }
cpal = "0.18"
egui = "0.37"
egui-wgpu = "0.37"
egui-winit = "0.37"
glam = { version = "0.34.3", features = ["bytemuck"] }
gltf = { version = "1.4.1", default-features = false, features = ["utils", "names"] }
hound = "3.5.1"
libc = "0.2"
mdns-sd = "0.22.0"
notify = "9"
png = "0.18.1"
pollster = "1.0.3"
ringbuf = "0.6.0"
rustfft = "6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wgpu = "30"
winit = "0.30"

# Debug builds stay fast to compile, but the FFT and GPU libraries run optimised.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
